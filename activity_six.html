<!DOCTYPE html>
<html>

<head>
    <title>CPU Schedule</title>
</head>

<style>
header {
    background-color: grey;
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 25px;
    border-radius: 10px;
    margin: 20px;
}

.table {
    margin: 20px;
    border-collapse: collapse;
    width: 95%;
}

.table th {
    background: grey;
    color: white;
}

.table th, .table td {
    border: 1px solid black;
    padding: 8px;
    text-align: center;
}

.chart {
    background-color: grey;
    color: white;
    text-align: center;
    padding: 15px;
    font-size: 25px;
    border-radius: 10px;
    margin: 20px;
}

.gantt {
    margin: 20px;
    border-collapse: collapse;
    width: 100%;
}

.gantt th {
    background: grey;
    color: white;
    border: 1px solid black;
    padding: 8px;
    text-align: center;
}
</style>

<body>

<header>
    <b>CPU Schedule</b>
</header>

<table class="table">
    <tr>
        <th>PROCESS</th>
        <th>AT</th>
        <th>BT</th>
        <th>CT</th>
        <th>TAT</th>
        <th>WT</th>
    </tr>

    <tr>
        <td>P1</td>
        <td>3</td>
        <td>5</td>
        <td>8</td>
        <td>5</td>
        <td>0</td>
    </tr>

    <tr>
        <td>P2</td>
        <td>4</td>
        <td>2</td>
        <td>10</td>
        <td>6</td>
        <td>4</td>
    </tr>

    <tr>
        <td>P3</td>
        <td>6</td>
        <td>4</td>
        <td>14</td>
        <td>8</td>
        <td>4</td>
    </tr>

    <tr>
        <td>P4</td>
        <td>16</td>
        <td>3</td>
        <td>19</td>
        <td>3</td>
        <td>0</td>
    </tr>

    <tr>
        <td>P5</td>
        <td>7</td>
        <td>17</td>
        <td>36</td>
        <td>29</td>
        <td>12</td>
    </tr>
</table>

<div class="chart">
    <b>Gantt Chart</b>
</div>

<table class="gantt">
    <tr>
        <th>IDLE</th>
        <th>P1</th>
        <th>P2</th>
        <th>P3</th>
        <th>IDLE</th>
        <th>P4</th>
        <th>P5</th>
    </tr>

    <tr>
        <td style="border:none; text-align:left;">0</td>
        <td style="border:none; text-align:left;">3</td>
        <td style="border:none; text-align:left;">8</td>
        <td style="border:none; text-align:left;">10</td>
        <td style="border:none; text-align:left;">14</td>
        <td style="border:none; text-align:left;">16</td>
        <td style="border:none; text-align:left;">19</td>
        <td style="border:none; text-align:left;">36</td>
    </tr>
</table>

</body>
</html>
